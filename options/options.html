<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link href="chrome://browser/content/extension.css" rel="stylesheet">
  <style>
    body { font-size: 120%; }
    h1 {
      margin-bottom: 0.1em;
      padding-bottom: 4px;
      border-bottom: 1px solid #888;
    }
    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: rgb(40, 40, 40);
        color: rgb(215, 215, 215);
        padding: 0em 2em 2em 2em;
      }
    }
  </style>
</head>

<body>
  <form>
    <h1>Optional Actions</h1>
    <label>Close original tab after moving to private window <input type="checkbox" id="closeExistingTab"> (Default: on)</label><br>
    <label>Remove address from history <input type="checkbox" id="removeFromHistory"> (Default: off)</label>
    <br><br>

    <button type="submit">Save Options</button>
  </form>
<script src="options.js"></script>
</body>

</html>
